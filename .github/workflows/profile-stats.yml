# Generate GitHub Stats + Top Languages cards as static SVGs
# Served from raw.githubusercontent.com -> no Vercel, no rate limits, no PAT_1 needed.

name: Generate Profile Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Stats card
        uses: lowlighter/metrics@latest
        with:
          filename: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          output_action: commit
          committer_branch: output-stats
          committer_message: "chore: refresh github stats card"
          config_timezone: Europe/Bucharest
          plugin_followup: yes

      - name: Top Languages card
        uses: lowlighter/metrics@latest
        with:
          filename: top-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          output_action: commit
          committer_branch: output-stats
          committer_message: "chore: refresh top languages card"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 2%
